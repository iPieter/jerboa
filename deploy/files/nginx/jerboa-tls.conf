# /etc/nginx/snippets/jerboa-tls.conf, written by deploy/harden_nginx.sh.
# Replaces /etc/letsencrypt/options-ssl-nginx.conf in the chat server block.
#
# Mozilla "intermediate" profile: TLS 1.2 and 1.3 only, AEAD ciphers with
# forward secrecy only (no 3DES, no CBC, no plain-RSA key exchange). Oldest
# clients that still connect: Android 4.4.2, iOS 9 / Safari 9, Chrome 31,
# Firefox 27, IE 11 on Windows 7, Java 8u31. TLS 1.3 suites are OpenSSL's
# defaults and need no configuration.
ssl_protocols @TLS_PROTOCOLS@;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;   # every suite above is strong; let clients pick the fastest

ssl_session_cache shared:jerboa_ssl:2m;   # ~8000 sessions; RAM is tight
ssl_session_timeout 1d;
ssl_session_tickets off;                  # nginx only rotates the ticket key on restart; tickets would undo forward secrecy
