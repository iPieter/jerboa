# /etc/nginx/snippets/jerboa-proxy.conf, written by deploy/harden_nginx.sh.
# Included in every location that proxies to the backend on 127.0.0.1:9000.
# (A location that sets any proxy_set_header inherits none from above, so all
# of them live here.)
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# nginx adds these to every response (snippets/jerboa-security-headers.conf).
# Hide the backend's own copies so a browser never receives two of them.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Permissions-Policy;
