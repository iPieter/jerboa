# /etc/nginx/conf.d/00-jerboa-http.conf, written by deploy/harden_nginx.sh.
# http-level settings; nginx.conf includes conf.d/*.conf inside http { }.
# ("gzip on;" itself is already in nginx.conf, so it is not repeated here.)

# No nginx version in the Server header or on error pages.
server_tokens off;

# Compress the text assets too, not only HTML. Images and woff/woff2 fonts are
# already compressed, so they are left alone.
gzip_vary on;
gzip_proxied any;          # also compress for clients behind proxies (Via header)
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
