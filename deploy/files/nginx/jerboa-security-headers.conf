# /etc/nginx/snippets/jerboa-security-headers.conf, written by deploy/harden_nginx.sh.
# Included at server level, so it covers the static frontend and the proxied
# API alike. "always" adds the header to error responses too.
# Note: a location that has its own add_header inherits none of these; include
# this file again in such a location.

# --- HSTS ---------------------------------------------------------------------
# Deliberately short to start: if HTTPS ever breaks, browsers forget this within
# 5 minutes. Once the site has run fine for a few days, raise it in steps and
# reload nginx after each step (nginx -t && systemctl reload nginx):
#     max-age=86400     (1 day)
#     max-age=604800    (1 week)
#     max-age=31536000  (1 year, the long-term value)
# Do NOT add includeSubDomains or preload unless every name under
# chat.ipieter.be serves valid HTTPS; www.chat.ipieter.be is not on the cert.
add_header Strict-Transport-Security "max-age=300" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# SAMEORIGIN rather than DENY: the PDF preview shows /api/files in a
# same-origin iframe.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# --- Content-Security-Policy, REPORT-ONLY for now ---------------------------------
# Browsers log violations in the devtools console but block nothing yet.
# Why each source is there:
#   script-src 'self'        the Vue CLI build has no inline scripts and no eval
#   style-src 'unsafe-inline' KaTeX (via vue-markdown) and Chart.js write inline
#                            style attributes/elements; cdnjs serves katex.min.css
#   font-src data: cdnjs     KaTeX fonts from cdnjs, small fonts inlined by webpack
#   img-src https: data: blob: users post markdown images from anywhere; the
#                            signup page shows an image from emoji.slack-edge.com
#   connect-src wss:         socket.io upgrades to wss://chat.ipieter.be
#   frame-src 'self'         the PDF preview iframe (/api/files?show=1)
# To enforce: use the site for a few days with devtools open (chat, PDF preview,
# LaTeX, admin charts, emoji, settings, iOS app unaffected), fix or allow what
# shows up, then rename the header to "Content-Security-Policy" and reload.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' data: https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://chat.ipieter.be wss://chat.ipieter.be; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
