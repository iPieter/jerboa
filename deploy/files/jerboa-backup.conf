# /etc/jerboa-backup.conf -- read by /usr/local/sbin/jerboa-backup.
# Written by deploy/backup.sh; migrate_db.sh rewrites the three DB_ lines.

# Which Postgres container and database to dump (via `docker exec`, local socket).
DB_CONTAINER=@DB_CONTAINER@
DB_USER=@DB_USER@
DB_NAME=@DB_NAME@

BACKUP_DIR=@BACKUP_DIR@
RETENTION_DAYS=14

# Space-separated list of directories with user content.
UPLOADS_DIRS="@UPLOADS_DIR@ @EMOJIS_DIR@"

# snapshot: nightly rsync snapshot with hard links (default; 14 days cost about
#           one copy of the uploads plus what was uploaded in those 14 days)
# tar:      one full tarball per night. The uploads are ~2.3 GB, so 14 of them
#           do NOT fit on this droplet; only use this with a bigger disk or a
#           shorter RETENTION_DAYS.
# off:      database only
UPLOADS_MODE=snapshot

# Optional: URL to GET after every run (`<url>` on success, `<url>/fail` on
# failure), e.g. a free healthchecks.io check, so you hear about it when
# backups stop. Outbound 443 is allowed by ufw.
HEALTHCHECK_URL=
